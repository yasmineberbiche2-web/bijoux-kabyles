  <path d="M100 145 L118 175 L82 175 Z" fill="#2e7a57" stroke="#d9dbdf" stroke-width="3"/>
  <g fill="url(#co)" stroke="#d9dbdf" stroke-width="2">
    <circle cx="100" cy="88" r="9"/><circle cx="38" cy="200" r="9"/><circle cx="162" cy="200" r="9"/>
  </g>
  <!-- pendeloques -->
  <g stroke="#9a9da4" stroke-width="1.5"><line x1="60" y1="205" x2="60" y2="225"/><line x1="100" y1="205" x2="100" y2="230"/><line x1="140" y1="205" x2="140" y2="225"/></g>
  <g fill="url(#ag)" stroke="#7d8087"><circle cx="60" cy="228" r="5"/><circle cx="100" cy="233" r="5"/><circle cx="140" cy="228" r="5"/></g>
</svg>
