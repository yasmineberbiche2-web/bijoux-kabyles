<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" role="img" aria-label="Fibule triangulaire en argent émaillé">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f5f7"/><stop offset=".55" stop-color="#c3c6cc"/><stop offset="1" stop-color="#8d9097"/></linearGradient>
    <radialGradient id="co" cx="35%" cy="30%" r="70%"><stop offset="0" stop-color="#f08a6c"/><stop offset=".55" stop-color="#c8452c"/><stop offset="1" stop-color="#7e2416"/></radialGradient>
  </defs>
  <!-- anneau et ardillon -->
  <circle cx="100" cy="45" r="32" fill="none" stroke="url(#ag)" stroke-width="9"/>
  <line x1="100" y1="12" x2="100" y2="95" stroke="#9a9da4" stroke-width="4" stroke-linecap="round"/>
